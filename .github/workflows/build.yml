name: Build OpenDTU

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch INV_MAX_COUNT (opcional)
        run: |
          sed -i 's/^#define[[:space:]]\+INV_MAX_COUNT[[:space:]]\+[0-9]\+/#define INV_MAX_COUNT 20/' Include/Configuration.h
          echo "INV_MAX_COUNT agora é:"
          grep -n 'INV_MAX_COUNT' Include/Configuration.h || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: .pio/build/**/firmware*.bin
