name: Build OpenDTU

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set INV_MAX_COUNT=20 (robusto)
        run: |
          set -e
          FILE=$(git ls-files | grep -E '(^|/)[Ii]nclude/Configuration\.h$' | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "Não encontrei Configuration.h. A procurar a macro..."
            git grep -n "INV_MAX_COUNT" || true
            exit 1
          fi
          echo "A editar $FILE"
          sed -i 's/^#define[[:space:]]\+INV_MAX_COUNT[[:space:]]\+[0-9]\+/#define INV_MAX_COUNT 20/' "$FILE"
          grep -n "INV_MAX_COUNT" "$FILE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: .pio/build/**/firmware*.bin
